
name: 🎭 Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: Test suite to run
        required: true
        default: regression
        type: choice
        options:
          - master
          - sanity
          - regression
          - api
          - web
          - datadriven

      browser:
        description: Select browser
        required: true
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: chromium

      mode:
        description: Run mode
        required: true
        type: choice
        options:
          - headless
          - headed
        default: headless

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Create .env File
        shell: pwsh
        run: |
          Copy-Item .env.example .env

      - name: Run Playwright Tests
        shell: pwsh
        env:
          CI: "1"
          TEST_SUITE: ${{ inputs.test_suite || 'regression' }}
          BROWSER: ${{ inputs.browser || 'chromium' }}
          MODE: ${{ inputs.mode || 'headless' }}
        run: |
          $suite = $env:TEST_SUITE
          $browser = $env:BROWSER
          $mode = $env:MODE

          Write-Host "Test Suite: $suite"
          Write-Host "Browser: $browser"
          Write-Host "Mode: $mode"

          $tag = $suite -replace '^test:', ''

          $testArgs = @(
            '--grep'
            "@$tag"
            "--project=$browser"
            '--reporter=dot,html'
            '--output=test-results'
          )

          if ($mode -eq 'headed') {
            $testArgs += '--headed'
          }

          npx playwright test @testArgs

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-report
          path: custom-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 30
